### 👷 Build a new Capability / RFC (for new platform levels, sub-systems, or anything currently 🔴/⏳ in the Capability Maturity Matrix)

Do NOT submit a cold-code PR for a new capability. This project operates with zero-pre-scoped capability expansion (see [BACKLOG.md §Scoping Policy](../../BACKLOG.md) — Active Constraints 10–13). Instead, file this RFC-type issue FIRST so maintainers can sign off before you spend time on implementation.

Use the template below to file the issue, then wait for a maintainer to label the issue `accepted` + assign a GAP-ID. PRs opened against an accepted GAP-ID with a signed-off strategic-posture exception are merged normally.

---

## Summary

**Requested capability name:** e.g., "Built-in CDC / Change Data Capture ingestion layer"

**Concrete user it solves this for:** e.g., "A fintech team with 3 PostgreSQL OLTP databases needs nightly 1:1 replication before L3 canonicalization."

**Measurable operator toil eliminated:** Approximate hours/week this saves if it existed today. e.g., "The team currently spends 4 hours/week writing and maintaining custom Debezium + Kafka Connect pipelines outside this framework; built-in CDC eliminates that and reduces incident MTTR for CDC lag."

**Why none of the existing 6 extension APIs fit (§5 of CONTRIBUTING.md):**
  1. `register_connector_factory` + a custom ConnectorFactory Protocol impl? (yes/no + explain)
  2. `register_backend` StorageBackend? (yes/no + explain)
  3. `register_provider` SecretsProvider? (yes/no + explain)
  4. QualityHookBackend? (yes/no + explain)
  5. SqlDbDriver? (yes/no + explain)
  6. MetricAggregation enum extension? (yes/no + explain)

If any of the 6 answers are "yes", this is probably NOT a new platform capability — please use that extension API (see [CONTRIBUTING.md §5](../../../CONTRIBUTING.md)) and open a standard feature request template or a PR directly instead.

