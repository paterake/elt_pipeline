## Proposal

### User-facing shape (what the user writes in YAML / CLI flags)

```yaml
# Paste a realistic YAML sketch of what the pipeline-level config
# OR manifest-level config looks like for this capability.
connector:
  type: postgres_cdc
  name: my_pg_source
  slot_name: elt_pipeline_repl
  publication: elt_pipeline_pub
```

CLI surface (sketch):
```bash
elt-pipeline cdc run path/to/pipeline.yaml --source my_pg_source --window 2026-01-01:2026-01-31
```

### Internal architecture sketch

Which of the 5 existing platform levels (L1…L5) does this touch? What goes into which new pCO underscore-prefixed submodule? Where is the compile-vs-runtime boundary? What new files, at package layout level, are being introduced?

List:
- **New files (pCO):** e.g., `src/elt_pipeline/cdc/__init__.py` (thin facade), `src/elt_pipeline/cdc/_models.py` (PgReplicationSlotSpec Pydantic model + validators), `src/elt_pipeline/cdc/_runtime.py` (logical slot bootstrap + pgoutput parser + L1 write).
- **Modified existing files:** e.g., `_cli_parser.py` new `cdc` subcommand block, `_cli_main.py` new handler block, `StageName` enum new `cdc` entry, `ErrorCategory` enum new `cdc_consistency_error` entry.
- **No modified existing files (preferred):** if this can live entirely as a Protocol-registration plugin in a separate PyPI package, say so and we'll link to it from the docs instead of merging core.

### Test plan — minimum +16 tests

What 16 specific tests? Name 16 categories (e.g., "manifest name regex validator ×2, CDC L1 write schema match, CDC slot creation idempotent, log truncation commit boundary, restart from checkpoint, parse 5 known pgoutput messages, error on unsupported pg version, L1 artifact audit line written, ConfigValidationError raised when publication not in source DB, etc.").

Minimum test count for capability PRs is enforced in review, not CI. PRs without it get a review-blocker tag.

### Compatibility & deprecations

Any breaking changes to `__all__` lists, CLI flags, Protocol signatures, Enum value names? If so, describe the 2-release deprecation window plan (default rule: keep a shim with `DeprecationWarning` for ≥2 minor releases before removal).

### Out of scope

Be explicit about what this RFC does NOT propose — prevents scope creep in review. e.g., "Initial CDC is Postgres-only via pgoutput. MySQL / SQL Server / MongoDB CDC variants are explicitly NOT included; they are future capability requests with their own RFCs."

