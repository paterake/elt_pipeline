Attach or paste:
- Work sample scripts / proof-of-concept code (if you've already built a prototype)
- Real pipeline configs + run artifacts showing the toil (anonymized output is fine — just timestamps + failure volume)
- Links to upstream docs for any third-party technology being integrated

## Strategic Posture Check

According to [docs/INDUSTRY_GAP_ANALYSIS.md §2 Posture](../../INDUSTRY_GAP_ANALYSIS.md), this framework intentionally delegates large sub-systems to mature external cloud/OSS products. Before maintainers sign off, they will assess:

- Is this better solved by an external OSS project (e.g., Airbyte, Fivetran, Debezium, dbt Cloud) integrated via existing extension APIs instead of being re-implemented here?
- If yes: is the effort of maintaining the in-house implementation over 5 years justified by a concrete use case where external integrations fail?

If the answer to the first question is "yes, external exists" and to the second is "no", the RFC will be respectfully closed with a recommendation to use the external path. Please include any arguments on this dimension already in your write-up — it saves review rounds.
