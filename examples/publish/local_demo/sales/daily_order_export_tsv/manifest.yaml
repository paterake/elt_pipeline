name: daily_order_export_tsv
stage: level5
domain: sales
version: v1
description: Export the level4 order summary datamart as a consumer-facing TSV with append-only stable deliveries.
source:
  stage: level4
  dataset: order_summary
  selection_mode: direct
delivery:
  target_type: local_filesystem
  output_format: tsv
  path_template: exports/{domain}/{publish_name}/window={window_label}/daily_order_export_tsv.{output_extension}
  replacement_mode: append_new_artifact
owner:
  owning_domain: sales
  owner_team: analytics_platform
consumer_label: finance_consumer
delivery_purpose: daily_summary_tsv
columns:
  - order_date
  - total_amount
validation:
  required_columns:
    - order_date
    - total_amount
