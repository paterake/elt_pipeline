name: daily_order_export_windowed
stage: level5
domain: sales
version: v1
description: Export a query-shaped level4 delivery artifact as jsonl with run-scoped history.
source:
  stage: level4
  dataset: order_summary
  selection_mode: query
delivery:
  target_type: local_filesystem
  output_format: jsonl
  path_template: exports/{domain}/{publish_name}/window={window_label}/daily_order_export_windowed.{output_extension}
  replacement_mode: versioned_delivery
owner:
  owning_domain: sales
  owner_team: analytics_platform
consumer_label: finance_consumer
delivery_purpose: daily_summary_windowed
columns:
  - order_date
  - total_amount
validation:
  required_columns:
    - order_date
    - total_amount
