name: canonical_shipments
stage: level3
domain: inventory
description: "Canonical shipments table — demonstrates the standard late-arrival pattern. No explicit partition_columns, so it relies on the L3 convention default of source_name plus business_date. load_mode partition_overwrite means dynamic partition overwrite scopes writes to only the source_name and business_date tuples appearing in this batch."
materialization: table
load_mode: partition_overwrite
target:
  table_name: canonical_shipments
sources:
  - logical_name: raw_shipments
    source_name: local_files
    entity_name: shipments
    table_name: shipments
owner:
  name: platform
