name: canonical_shipments
stage: level3
domain: inventory
description: "Canonical shipments table — demonstrates event-day partitioning. Explicit partition_columns of source_name plus business_date (=ship_date) so each shipment lands in its own event-day partition, the way canonical models cluster data by when the event happened rather than when it arrived."
materialization: table
load_mode: full_refresh
target:
  table_name: canonical_shipments
  partition_columns:
    - source_name
    - business_date
sources:
  - logical_name: raw_shipments
    source_name: local_files
    entity_name: shipments
    table_name: shipments
owner:
  name: platform
