name: canonical_orders
stage: level3
domain: sales
description: Canonical orders table implementing the late-arrival repartitioning pattern. Reads L2 by ingest_date (arrival day), writes L3 by business_date (event day) so late-arriving data lands in the correct historical partition automatically via dynamic partition overwrite.
materialization: table
load_mode: full_refresh
target:
  table_name: canonical_orders
sources:
  - logical_name: raw_orders
    source_name: local_files
    entity_name: orders
    table_name: orders
owner:
  name: platform
  email: data-platform@example.com
governance:
  classification: confidential
  retention_days: 2555
  retention_partition_column: business_date
  columns:
    - name: customer_email
      description: Customer account email address
      classification: restricted_pii
      masking: redact_email
    - name: customer_phone
      description: Customer contact phone number
      classification: restricted_pii
      masking: truncate_middle
    - name: billing_zip
      description: Billing address postal code
      classification: confidential
      masking: truncate_end
    - name: order_total_usd
      description: Gross order amount in USD
      classification: internal
  custom_properties:
    data_owner: "Sales Ops"
    sla_tier: gold
