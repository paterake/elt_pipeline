[project]
name = "elt-pipeline"
version = "0.1.0"
description = "Shared runtime for a configuration-driven ELT pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
spark = [
  "pyspark==4.1.2",
]
s3 = [
  "boto3>=1.34,<2.0",
]
emr = [
  "boto3>=1.34,<2.0",
  "pyspark==4.1.2",
]
delta = [
  "delta-spark>=4.0,<5.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.12,<0.13",
  "pyspark==4.1.2",
]

[project.scripts]
elt-pipeline = "elt_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
