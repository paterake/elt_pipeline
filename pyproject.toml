[project]
name = "elt-pipeline"
version = "0.1.0"
description = "Shared runtime for a configuration-driven ELT pipeline with explicit architectural levels (L1 raw → L2 source-aligned → L3 canonical Iceberg → L4 consumer marts → L5 static exports), a 4-phase execution lifecycle, a 4-tier SQL validity chain, and a portable Trino 468 JDBC serving endpoint."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "paterake" },
]
keywords = [
  "elt",
  "etl",
  "data-pipeline",
  "data-engineering",
  "spark",
  "iceberg",
  "trino",
  "data-lakehouse",
  "datalake",
  "data-warehouse",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0,<7.0",
]

[project.urls]
Homepage       = "https://github.com/paterake/elt_pipeline"
Repository     = "https://github.com/paterake/elt_pipeline"
Documentation  = "https://github.com/paterake/elt_pipeline/tree/main/docs"
Issues         = "https://github.com/paterake/elt_pipeline/issues"

[project.optional-dependencies]
spark = [
  "pyspark==4.1.2",
]
s3 = [
  "boto3>=1.34,<2.0",
]
gcs = [
  "google-cloud-storage>=2.14,<3.0",
]
adls = [
  "azure-storage-file-datalake>=12.13,<13.0",
]
emr = [
  "boto3>=1.34,<2.0",
  "pyspark==4.1.2",
]
dataproc = [
  "google-cloud-storage>=2.14,<3.0",
  "pyspark==4.1.2",
]
synapse = [
  "azure-storage-file-datalake>=12.13,<13.0",
  "pyspark==4.1.2",
]
delta = [
  "delta-spark>=4.0,<5.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.12,<0.13",
  "pyspark==4.1.2",
]

[project.scripts]
elt-pipeline = "elt_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
